name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 领域层与插件层的单元测试。任一失败即视为包不可交付。
  unit-tests:
    name: Unit tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # 界面测试需要 GUI 会话与宿主 App，因此单独用带窗口服务的 runner。
  ui-tests:
    name: UI tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate UI test project
        run: ./generate-ui-test-project.sh
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project BookletMakerUITests.xcodeproj \
            -scheme BookletMakerUITests \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult
      - name: Run UI tests
        run: |
          xcodebuild test-without-building \
            -project BookletMakerUITests.xcodeproj \
            -scheme BookletMakerUITests \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults.xcresult
          retention-days: 7
